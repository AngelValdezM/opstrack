<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OpsTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">OpsTrack</span>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Empleados</h2>

        <form id="form-empleado" class="row g-2 mb-4">
            <div class="col-auto">
                <input type="text" id="input-nombre" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="col-auto">
                <input type="text" id="input-cargo" class="form-control" placeholder="Cargo" required>
            </div>
            <input type="hidden" id="input-id-editar" value="">
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Agregar empleado</button>
            </div>
        </form>


        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Cargo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-empleados">
                <!-- tu código JS va a llenar esto -->
            </tbody>
        </table>
    </div>

    <div class="container mt-5">
    <h2>Incidencias</h2>
        <form id="form-incidencia" class="row g-2 mb-4">
            <div class="col-auto">
                <input type="number" id="input-turno-id" class="form-control" placeholder="ID de turno" required>
            </div>
            <div class="col-auto">
                <input type="text" id="input-descripcion" class="form-control" placeholder="Descripción" required>
            </div>
            <div class="col-auto">
                <select id="input-severidad" class="form-select">
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Registrar incidencia</button>
            </div>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Severidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-incidencias"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
    </body>
</html>
