<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OpsTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
    <body>
    

    <div id="seccion-login" class="container mt-4">
        <h2>Iniciar sesión</h2>
        <form id="form-login" class="row g-2">
            <div class="col-auto">
                <input type="text" id="input-username" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="col-auto">
                <input type="password" id="input-password" class="form-control" placeholder="Contraseña" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </div>
        </form>
        <p id="mensaje-login" class="text-danger mt-2"></p>
    </div>

    <div id="seccion-app" style="display: none;">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <span class="navbar-brand">OpsTrack</span>
            </div>
        </nav>

        <div class="container mt-4">
        <h2>Dashboard</h2>

            <div class="row mb-4">
                <div class="col-auto">
                    <div class="card p-3">
                        <span class="text-muted">Incidencias abiertas</span>
                        <h3 id="contador-abiertas">-</h3>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <canvas id="grafico-severidad"></canvas>
                </div>
                <div class="col-md-6">
                    <canvas id="grafico-turnos"></canvas>
                </div>
            </div>
        </div>

        <div class="container mt-4">
            <h2>Empleados</h2>

            <form id="form-empleado" class="row g-2 mb-4">
                <div class="col-auto">
                    <input type="text" id="input-nombre" class="form-control" placeholder="Nombre" required>
                </div>
                <div class="col-auto">
                    <input type="text" id="input-cargo" class="form-control" placeholder="Cargo" required>
                </div>
                <input type="hidden" id="input-id-editar" value="">
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Agregar empleado</button>
                </div>
            </form>


            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Cargo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-empleados"></tbody>
            </table>
        </div>

        <div class="container mt-5">
        <h2>Turnos</h2>

        <form id="form-turno" class="row g-2 mb-4">
            <div class="col-auto">
                <input type="number" id="input-empleado-id" class="form-control" placeholder="ID de empleado" required>
            </div>
            <div class="col-auto">
            <select id="input-estado-turno" class="form-select">
                <option value="activo">Activo</option>
                <option value="finalizado">Finalizado</option>
            </select>
            </div>
            <div class="col-auto">
                <input type="date" id="input-fecha" class="form-control" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Registrar turno</button>
            </div>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Empleado</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody id="tabla-turnos"></tbody>
        </table>
        </div>

        <div class="container mt-5">
        <h2>Incidencias</h2>
            <form id="form-incidencia" class="row g-2 mb-4">
                <div class="col-auto">
                    <input type="number" id="input-turno-id" class="form-control" placeholder="ID de turno" required>
                </div>
                <div class="col-auto">
                    <input type="text" id="input-descripcion" class="form-control" placeholder="Descripción" required>
                </div>
                <div class="col-auto">
                    <select id="input-severidad" class="form-select">
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Registrar incidencia</button>
                </div>
            </form>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Severidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-incidencias"></tbody>
            </table>
        </div>

    </div>    

    <script src="app.js"></script>
    </body>
</html>
