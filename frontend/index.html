<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OpsTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">OpsTrack</span>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Empleados</h2>

        <form id="form-empleado" class="row g-2 mb-4">
            <div class="col-auto">
                <input type="text" id="input-nombre" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="col-auto">
                <input type="text" id="input-cargo" class="form-control" placeholder="Cargo" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Agregar empleado</button>
            </div>
        </form>


        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Cargo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-empleados">
                <!-- tu código JS va a llenar esto -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
    </body>
</html>
